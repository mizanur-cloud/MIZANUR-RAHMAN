    <script>
      // Ignore Vite HMR WebSocket closing errors in dev/iframe environment per system constraints
      window.addEventListener('unhandledrejection', function(e) {
        var msg = e && e.reason && (e.reason.message || String(e.reason));
        if (msg && (msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1)) {
          e.preventDefault();
        }
      });
      window.addEventListener('error', function(e) {
        var msg = e && (e.message || String(e));
        if (msg && (msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1)) {
          e.preventDefault();
        }
      });
    </script>
